# ==============================================================================
# YAZI CONFIGURATION — Fixed & Enhanced
# ==============================================================================

[mgr]
show_hidden  = false
sort_by      = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_symlink   = true
# Multi-pane ratio: parent | current | preview
ratio          = [1, 2, 3]

# ------------------------------------------------------------------------------
# OPENERS
# ------------------------------------------------------------------------------
[opener]

pdf = [
    { run = 'evince %s', desc = "Evince", orphan = true, for = "unix" }
]

office = [
    { run = 'onlyoffice-desktopeditors %s1', desc = "OnlyOffice", orphan = true, for = "unix" }
]

video = [
    { run = 'haruna %s', desc = "Haruna", orphan = true, for = "unix" },
    { run = 'mpv %s',    desc = "mpv",    orphan = true, for = "unix" }
]

image = [
    { run = 'mpv %s', desc = "mpv", orphan = true, for = "unix" }
]

text = [
    { run = 'nvim %s', desc = "Neovim", block = true, for = "unix" }
]

archive = [
    { run = '7z x %s1', desc = "Extract Here", block = true, for = "unix" }
]

default = [
    { run = 'xdg-open %s1', desc = "Open", orphan = true, for = "unix" }
]

# ------------------------------------------------------------------------------
# OPEN RULES  (mime wins over url glob — most specific first)
# ------------------------------------------------------------------------------
[open]
prepend_rules = [

    # PDFs
    { mime = "application/pdf", use = ["pdf"] },

    # Office files
    { mime = "application/msword", use = ["office"] },
    { mime = "application/vnd.openxmlformats-officedocument.*", use = ["office"] },
    { mime = "application/vnd.ms-excel", use = ["office"] },
    { mime = "application/vnd.ms-powerpoint", use = ["office"] },
    { mime = "application/vnd.oasis.opendocument.*", use = ["office"] },

    # Video
    { mime = "video/*", use = ["video"] },

    # Images
    { mime = "image/*", use = ["image"] },

    # Text / code — mime first, then fileurl extensions
    { mime = "text/*", use = ["text"] },
    { mime = "application/json", use = ["text"] },
    { mime = "application/toml", use = ["text"] },
    { mime = "application/x-yaml", use = ["text"] },
    { mime = "application/x-sh", use = ["text"] },

    # Archives — mime first
    { mime = "application/zip",    use = ["archive"] },
    { mime = "application/x-tar",  use = ["archive"] },
    { mime = "application/gzip",   use = ["archive"] },
    { mime = "application/x-bzip2", use = ["archive"] },
    { mime = "application/x-xz",   use = ["archive"] },
    { mime = "application/x-7z-compressed", use = ["archive"] },
    { mime = "application/x-rar",  use = ["archive"] },
    # Extension fallbacks for source/text files whose MIME type is generic.
    { url = "*.md", use = ["text"] },
    { url = "*.mdx", use = ["text"] },
    { url = "*.txt", use = ["text"] },
    { url = "*.py", use = ["text"] },
    { url = "*.js", use = ["text"] },
    { url = "*.ts", use = ["text"] },
    { url = "*.jsx", use = ["text"] },
    { url = "*.tsx", use = ["text"] },
    { url = "*.rs", use = ["text"] },
    { url = "*.go", use = ["text"] },
    { url = "*.html", use = ["text"] },
    { url = "*.css", use = ["text"] },
    { url = "*.toml", use = ["text"] },
    { url = "*.yaml", use = ["text"] },
    { url = "*.yml", use = ["text"] },
    { url = "*.jsonc", use = ["text"] },
    { url = "*.sh", use = ["text"] },
    { url = "*.fish", use = ["text"] },
    { url = "*.conf", use = ["text"] },
    { url = "*.ini", use = ["text"] },
]

# Catch-all appended AFTER the defaults so built-in rules (folders, etc.) win.
append_rules = [
    { mime = "*", use = ["default"] },
]
